name: Verify V5 production slice

on:
  push:
    branches: ["main", "v5-production", "v5-movement-collision", "v5-visible-walk"]
    paths:
      - "v5/**"
      - ".github/workflows/v5-verify.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "v5/**"
      - ".github/workflows/v5-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: node --check v5/game.js

      - name: Production asset gate
        run: |
          test -f v5/assets/environments/tap_interior.jpg
          test -f v5/assets/characters/rick_master.png
          test -f v5/assets/characters/rick-side-walk.png
          test -f v5/assets/characters/rick-back-walk.png
          test -f v5/assets/characters/laura_master.png
          test -f v5/assets/characters/laura-side-walk.png
          test -f v5/assets/characters/laura-back-walk.png
          test -f v5/assets/characters/will_master.png
          test -f v5/assets/characters/denise_master.png
          test -f v5/assets/characters/dad_master.png
          test -f v5/assets/characters/fats_master.png
          test -f v5/assets/props/kendal_display.jpg
          test -f v5/assets/props/wristband.png
          test -f v5/assets/props/glasses.png

      - name: Start server
        run: |
          python3 -m http.server 8000 >/tmp/v5-http.log 2>&1 &
          sleep 2

      - name: Browser smoke
        run: |
          CHROME="$(which google-chrome || which chromium || which chromium-browser)"
          FLAGS="--headless=new --no-sandbox --disable-gpu --enable-unsafe-swiftshader --disable-dev-shm-usage --virtual-time-budget=9000"

          "$CHROME" $FLAGS --dump-dom "http://127.0.0.1:8000/v5/index.html?reset=1" > smoke.html
          grep -q 'data-v5-ready="true"' smoke.html
          grep -q 'data-v5-scene="tap"' smoke.html
          grep -q 'data-v5-assets="production"' smoke.html
          grep -q 'data-v5-hotspots="will,denise,dad,display,glasses"' smoke.html
          grep -q 'data-v5-grounded-sprites="true"' smoke.html
          grep -q 'data-v5-layered-walker="true"' smoke.html
          grep -q 'data-v5-depth-occlusion="true"' smoke.html
          grep -q 'data-v5-collision-count="20"' smoke.html
          ! grep -q 'data-v5-error=' smoke.html

      - name: Full social-puzzle regression
        run: |
          CHROME="$(which google-chrome || which chromium || which chromium-browser)"
          FLAGS="--headless=new --no-sandbox --disable-gpu --enable-unsafe-swiftshader --disable-dev-shm-usage --virtual-time-budget=10000"

          "$CHROME" $FLAGS --dump-dom "http://127.0.0.1:8000/v5/index.html?reset=1&autotest=quest-chain" > chain.html
          grep -q 'data-v5-auto-test="COMPLETE:wristband=true:access=true:glasses=true:wine=true"' chain.html
          ! grep -q 'data-v5-error=' chain.html

      - name: Physical collision regression
        run: |
          CHROME="$(which google-chrome || which chromium || which chromium-browser)"
          FLAGS="--headless=new --no-sandbox --disable-gpu --enable-unsafe-swiftshader --disable-dev-shm-usage --virtual-time-budget=5000"

          "$CHROME" $FLAGS --dump-dom "http://127.0.0.1:8000/v5/index.html?reset=1&autotest=collision-map" > collision.html
          grep -q 'data-v5-collision-test="pass"' collision.html
          grep -q 'data-v5-walk-motion="pass"' collision.html
          grep -q 'data-v5-layered-walker="true"' collision.html
          ! grep -q 'data-v5-error=' collision.html

      - name: Capture production screenshot
        if: always()
        run: |
          CHROME="$(which google-chrome || which chromium || which chromium-browser)"
          timeout 30s "$CHROME" --headless=new --no-sandbox --disable-gpu --enable-unsafe-swiftshader --disable-dev-shm-usage --window-size=1600,900 --virtual-time-budget=8000 --screenshot=v5-tap.png "http://127.0.0.1:8000/v5/index.html?reset=1" || true
          timeout 30s "$CHROME" --headless=new --no-sandbox --disable-gpu --enable-unsafe-swiftshader --disable-dev-shm-usage --window-size=1600,900 --virtual-time-budget=5000 --screenshot=v5-collision-debug.png "http://127.0.0.1:8000/v5/index.html?reset=1&debug=1" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-production-screenshot
          path: |
            v5-tap.png
            smoke.html
            chain.html
            collision.html
            v5-collision-debug.png
          retention-days: 3
