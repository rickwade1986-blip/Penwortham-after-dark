name: Verify V2 rebuild

on:
  push:
    branches: ["v2-rebuild"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          node --check v2/js/config.js
          node --check v2/js/state.js
          node --check v2/js/characters.js
          node --check v2/js/writing.js
          node --check v2/js/dialogue.js
          node --check v2/js/abilities.js
          node --check v2/js/ui.js
          node --check v2/js/player.js
          node --check v2/js/AdventureBase.js
          node --check v2/js/scenes/BootScene.js
          node --check v2/js/scenes/StreetScene.js
          node --check v2/js/scenes/ShopScene.js
          node --check v2/js/scenes/TapScene.js
          node --check v2/js/scenes/TurkishScene.js
          node --check v2/js/scenes/KendalScene.js
          node --check v2/js/scenes/FatsScene.js
          node --check v2/js/scenes/UIScene.js
          node --check v2/js/boot.js
      - name: Start server
        run: |
          python3 -m http.server 8000 > /tmp/http.log 2>&1 &
          sleep 2
      - name: Browser smoke test
        run: |
          CHROME="$(which google-chrome || which chromium || which chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom             http://127.0.0.1:8000/v2/index.html?reset=1 > rendered.html
          grep -q 'data-v2-ready="true"' rendered.html
          grep -q 'data-v2-room="StreetScene"' rendered.html
          grep -q '<canvas' rendered.html
          grep -q "Find Rick's car" rendered.html
          grep -q 'BULLSHIT' rendered.html
      - name: Capture V2 screenshot
        run: |
          CHROME="$(which google-chrome || which chromium || which chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --window-size=1600,900 --virtual-time-budget=5000             --screenshot=v2-smoke.png http://127.0.0.1:8000/v2/index.html?reset=1
      - uses: actions/upload-artifact@v4
        with:
          name: v2-smoke
          path: v2-smoke.png
          retention-days: 3
