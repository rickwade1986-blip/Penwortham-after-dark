name: Verify V2 rebuild

on:
  push:
    branches: ["v2-rebuild"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          node --check v2/js/config.js
          node --check v2/js/state.js
          node --check v2/js/characters.js
          node --check v2/js/writing.js
          node --check v2/js/dialogue.js
          node --check v2/js/abilities.js
          node --check v2/js/ui.js
          node --check v2/js/player.js
          node --check v2/js/AdventureBase.js
          node --check v2/js/scenes/BootScene.js
          node --check v2/js/scenes/StreetScene.js
          node --check v2/js/scenes/ShopScene.js
          node --check v2/js/scenes/TapScene.js
          node --check v2/js/scenes/TurkishScene.js
          node --check v2/js/scenes/KendalScene.js
          node --check v2/js/scenes/FatsScene.js
          node --check v2/js/scenes/UIScene.js
          node --check v2/js/boot.js
      - name: Start server
        run: |
          python3 -m http.server 8000 > /tmp/http.log 2>&1 &
          sleep 2
      - name: Browser diagnostics
        run: |
          CHROME="$(which google-chrome || which chromium || which chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=9000 --dump-dom             http://127.0.0.1:8000/v2/index.html?reset=1 > rendered.html
          echo "READY=$(grep -c 'data-v2-ready="true"' rendered.html || true)"
          echo "ROOM=$(grep -c 'data-v2-room="StreetScene"' rendered.html || true)"
          echo "CANVAS=$(grep -c '<canvas' rendered.html || true)"
          echo "OBJECTIVE=$(grep -c "Find Rick's car" rendered.html || true)"
          echo "ABILITY=$(grep -c 'BULLSHIT' rendered.html || true)"
          grep -o '<body[^>]*>' rendered.html | head -1 || true
          grep -o '<div id="objective"[^>]*>[^<]*' rendered.html | head -1 || true
          grep -o '<button id="ability"[^>]*>[^<]*' rendered.html | head -1 || true
          test "$(grep -c 'data-v2-ready="true"' rendered.html || true)" -ge 1
          test "$(grep -c 'data-v2-room="StreetScene"' rendered.html || true)" -ge 1
          test "$(grep -c '<canvas' rendered.html || true)" -ge 1
          test "$(grep -c "Find Rick's car" rendered.html || true)" -ge 1
      - name: Capture V2 screenshot
        if: always()
        run: |
          CHROME="$(which google-chrome || which chromium || which chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --window-size=1600,900 --virtual-time-budget=7000             --screenshot=v2-smoke.png http://127.0.0.1:8000/v2/index.html?reset=1 || true
          cp rendered.html rendered-copy.html || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-smoke
          path: |
            v2-smoke.png
            rendered-copy.html
          retention-days: 3
