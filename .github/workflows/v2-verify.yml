name: Verify V2 rebuild

on:
  push:
    branches: ["v2-rebuild"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          node --check v2/js/config.js
          node --check v2/js/state.js
          node --check v2/js/characters.js
          node --check v2/js/writing.js
          node --check v2/js/dialogue.js
          node --check v2/js/abilities.js
          node --check v2/js/player.js
          node --check v2/js/scenes/BootScene.js
          node --check v2/js/scenes/TestRoomScene.js
          node --check v2/js/scenes/UIScene.js
          node --check v2/js/boot.js
      - name: Start server
        run: |
          python3 -m http.server 8000 > /tmp/http.log 2>&1 &
          sleep 2
      - name: Browser smoke test
        run: |
          CHROME="$(which google-chrome || which chromium || which chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=7000 --dump-dom             http://127.0.0.1:8000/v2/index.html > rendered.html
          echo "---- rendered state ----"
          grep -o 'data-v2-[^ >]*' rendered.html || true
          grep -o '<canvas[^>]*>' rendered.html | head -1 || true
          grep -o 'FOUNDATION TEST' rendered.html | head -1 || true
          echo "---- top of rendered DOM ----"
          head -80 rendered.html
          grep -q 'data-v2-ready="true"' rendered.html
          grep -q '<canvas' rendered.html
          grep -q 'FOUNDATION TEST' rendered.html
