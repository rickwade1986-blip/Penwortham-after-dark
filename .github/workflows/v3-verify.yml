name: Verify V3

on:
  push:
    branches: ["v3-rebuild"]
    paths:
      - "v3/**"
      - ".github/workflows/v3-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: node --check v3/game.js

      - name: Verify generated art exists
        run: |
          test -f v3/assets/characters/rick-down-0.png
          test -f v3/assets/characters/laura-down-0.png
          test -f v3/assets/characters/will.png
          test -f v3/assets/characters/denise.png
          test -f v3/assets/characters/dad.png
          test -f v3/assets/characters/fats.png
          test -f v3/assets/rooms/street.png
          test -f v3/assets/rooms/tap.png
          test -f v3/assets/rooms/turkish.png

      - name: Start server
        run: |
          python3 -m http.server 8000 >/tmp/pad-v3-http.log 2>&1 &
          sleep 2

      - name: Smoke each important scene
        run: |
          CHROME="$(which google-chrome || which chromium || which chromium-browser)"
          FLAGS="--headless=new --no-sandbox --disable-gpu --enable-unsafe-swiftshader --disable-dev-shm-usage --virtual-time-budget=9000"

          testpage () {
            NAME="$1"
            URL="$2"
            set +e
            "$CHROME" $FLAGS --dump-dom "$URL" > "$NAME.html" 2> "$NAME.chrome.log"
            CODE=$?
            set -e
            echo "===== $NAME chrome exit $CODE ====="
            grep -o '<body[^>]*>' "$NAME.html" | head -1 || true
            grep -o 'data-[a-z-]*="[^"]*"' "$NAME.html" | head -20 || true
            tail -30 "$NAME.chrome.log" || true
          }

          testpage street "http://127.0.0.1:8000/v3/index.html?reset=1&room=street&quest=CAR"
          testpage shop "http://127.0.0.1:8000/v3/index.html?room=shop&quest=MILK"
          testpage tap "http://127.0.0.1:8000/v3/index.html?room=tap&quest=WILL"
          testpage turkish "http://127.0.0.1:8000/v3/index.html?room=turkish&quest=TURKISH"
          testpage fats "http://127.0.0.1:8000/v3/index.html?room=fats&quest=FATS"

          grep -q 'data-game-ready="true"' street.html
          grep -q 'data-game-ready="true"' shop.html
          grep -q 'data-game-ready="true"' tap.html
          grep -q 'data-game-ready="true"' turkish.html
          grep -q 'data-game-ready="true"' fats.html
          grep -q '<canvas' street.html
          grep -q "Find Rick's car" street.html

      - name: Capture V3 screenshots
        if: always()
        run: |
          CHROME="$(which google-chrome || which chromium || which chromium-browser)"
          FLAGS="--headless=new --no-sandbox --disable-gpu --enable-unsafe-swiftshader --disable-dev-shm-usage --window-size=1800,828 --virtual-time-budget=7000"
          "$CHROME" $FLAGS --screenshot=v3-street.png "http://127.0.0.1:8000/v3/index.html?reset=1&room=street&quest=CAR" || true
          "$CHROME" $FLAGS --screenshot=v3-tap.png "http://127.0.0.1:8000/v3/index.html?room=tap&quest=WILL" || true
          "$CHROME" $FLAGS --screenshot=v3-turkish.png "http://127.0.0.1:8000/v3/index.html?room=turkish&quest=TURKISH" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-diagnostics
          path: |
            *.html
            *.chrome.log
            v3-*.png
          retention-days: 3
