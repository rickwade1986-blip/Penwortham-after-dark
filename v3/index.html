<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Penwortham After Dark</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="game"></div>

  <header id="top-ui">
    <div id="brand">PENWORTHAM <b>AFTER DARK</b></div>
    <div id="objective">Find Rick's car</div>
    <div id="hero-chip"><strong id="hero-name">RICK</strong><span id="hp">♥♥♥♥♥♥</span></div>
  </header>

  <div id="move-hint"><span></span><small>MOVE</small></div>
  <div id="joystick" class="hidden"><div id="knob"></div></div>

  <div id="nearby" class="hidden"></div>

  <div id="buttons">
    <button id="swap" type="button">SWAP</button>
    <button id="act" type="button">ACT</button>
    <button id="ability" type="button">BULLSHIT</button>
  </div>

  <section id="dialogue" class="hidden" aria-live="polite">
    <div id="portrait"></div>
    <div class="dialogue-copy">
      <div id="speaker"></div>
      <div id="line"></div>
      <div id="advance">ACT ›</div>
    </div>
  </section>

  <div id="toast" class="hidden"></div>

  <div id="portrait-lock">
    <div>↻</div>
    <small>landscape, behbeh</small>
  </div>

  <script src="./vendor/phaser.min.js"></script>
  <script src="./game.js"></script>
</body>
</html>
