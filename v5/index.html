<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Penwortham After Dark</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="app">
  <canvas id="game"></canvas>

  <header id="hud">
    <div id="brand">PENWORTHAM <b>AFTER DARK</b></div>
    <div id="objective"><small>OBJECTIVE</small><strong id="objectiveText">Find Rick's car</strong></div>
    <div id="party"><strong id="leaderName">RICK</strong><span>♥♥♥♥♥♥</span></div>
  </header>

  <div id="prompt" class="hidden"></div>

  <div id="controls">
    <button id="swap">SWAP</button>
    <button id="act">ACT</button>
    <button id="ability">BULLSHIT</button>
  </div>

  <div id="moveHint"><i></i><span>MOVE</span></div>
  <div id="stick" class="hidden"><i></i></div>

  <section id="sceneCard" class="hidden">
    <div class="sceneFrame">
      <canvas id="sceneArt"></canvas>
      <div class="sceneShade"></div>
      <div class="sceneCopy">
        <div class="sceneKicker" id="sceneKicker"></div>
        <h2 id="sceneTitle"></h2>
        <p id="sceneText"></p>
        <div id="sceneChoices"></div>
      </div>
    </div>
  </section>

  <section id="dialogue" class="hidden">
    <div class="speaker" id="speaker"></div>
    <div class="line" id="line"></div>
    <small>ACT ›</small>
  </section>

  <div id="toast" class="hidden"></div>

  <div id="rotate"><div>↻</div><strong>landscape, behbeh</strong></div>
</main>
<script src="./game.js"></script>
</body>
</html>
